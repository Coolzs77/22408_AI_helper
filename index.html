    <script>
        // Lightweight markdown parser
        // Note: This parser processes trusted content from d.txt (repository file)
        function parseMarkdown(text) {
            let html = text;
            
            // Code blocks (process first to protect code content)
            html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            
            // Headers
            html = html.replace(/^#### (.*$)/gim, '<h4>$1</h4>');
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            
            // Bold
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Horizontal rules
            html = html.replace(/^---$/gim, '<hr>');
            
            // Links
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
            
            // Process lines and handle lists properly
            const lines = html.split('\n');
            let result = '';
            let inCodeBlock = false;
            let listItems = [];
            let paragraph = '';
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                // Track code blocks
                if (line.includes('<pre><code>')) inCodeBlock = true;
                if (line.includes('</code></pre>')) {
                    inCodeBlock = false;
                    result += line + '\n';
                    continue;
                }
                
                // Handle list items
                if (line.match(/^- (.*)$/)) {
                    // Close any open paragraph
                    if (paragraph) {
                        result += '<p>' + paragraph + '</p>\n';
                        paragraph = '';
                    }
                    // Add to list items
                    listItems.push(line.replace(/^- (.*)$/, '$1'));
                    continue;
                } else if (listItems.length > 0) {
                    // Close the list
                    result += '<ul>\n';
                    listItems.forEach(item => {
                        result += '<li>' + item + '</li>\n';
                    });
                    result += '</ul>\n';
                    listItems = [];
                }
                
                // Handle special tags (headers, hr, pre)
                if (line.startsWith('<h') || line.startsWith('<hr') || line.startsWith('<pre') || line === '') {
                    if (paragraph) {
                        result += '<p>' + paragraph + '</p>\n';
                        paragraph = '';
                    }
                    result += line + '\n';
                } else if (inCodeBlock) {
                    result += line + '\n';
                } else {
                    // Regular text - accumulate into paragraph
                    if (paragraph) paragraph += ' ';
                    paragraph += line;
                }
            }
            
            // Close any remaining list
            if (listItems.length > 0) {
                result += '<ul>\n';
                listItems.forEach(item => {
                    result += '<li>' + item + '</li>\n';
                });
                result += '</ul>\n';
            }
            
            // Close any remaining paragraph
            if (paragraph) {
                result += '<p>' + paragraph + '</p>\n';
            }
            
            return result;
        }
    </script>

### 2.4 面试准备核心

#### 必须准备的内容（按重要性排序）

**1. 毕设详细介绍（最重要！占面试很大比重）**
准备时间：每天至少1小时，反复演练

准备内容：
\`\`\`
A. 开场介绍（2分钟）
   - 研究背景：为什么选这个课题？
     "随着智慧城市发展，红外成像在夜间监控中应用广泛，
      但传统可见光算法在红外图像上表现不佳..."
   
   - 研究意义：解决什么实际问题？
     "本研究针对红外图像低对比度、弱纹理的特点，
      设计轻量化AI算法，可部署在低成本边缘设备..."

B. 技术方案详解（5-8分钟）
   必须能清晰讲解：
   
   1) 整体架构（参考开题报告图4.1）
      - 数据输入层：FLIR数据集，为什么选这个数据集？
      - 算法处理层：YOLOv5检测 + 多目标跟踪
      - 嵌入式部署层：RV1126平台，为什么选这个芯片？
      - 性能评估层：mAP、MOTA等指标
   
   2) 检测模块（YOLOv5）
      - 为什么选YOLOv5？（速度与精度平衡）
      - 网络结构：Backbone、Neck、Head分别做什么？
      - 轻量化改进：
        * 骨干网络替换（Ghost-C3、Shuffle-C3）
        * 损失函数优化（CIoU→SIoU/EIoU）
        * 注意力机制（CBAM、CoordAttention）
      - 每个改进解决什么问题？效果如何？
   
   3) 跟踪模块
      - 对比三种算法：DeepSORT、ByteTrack、CenterTrack
      - 各算法原理：
        * DeepSORT：卡尔曼滤波 + ReID特征匹配
        * ByteTrack：双重关联，高低置信度分别处理
        * CenterTrack：中心点偏移预测
      - 为什么最终选择XX算法？
      - 在红外图像上的特殊处理
   
   4) 嵌入式部署
      - 模型转换流程：PyTorch→ONNX→RKNN
      - INT8量化：如何保证量化后精度？
      - C++实现：RKNN API使用
      - 性能优化：如何达到25fps？

C. 实验结果（3分钟）
   准备数据图表：
   - 检测性能：mAP@0.5达到75%以上（目标值）
   - 跟踪性能：MOTA达到60%以上
   - 系统性能：25fps实时处理
   - 消融实验：每个改进模块的贡献度

D. 遇到的困难与解决方案（2分钟）
   准备3-5个具体案例：
   - 问题：红外小目标漏检严重
     解决：引入注意力机制，改进特征金字塔
   
   - 问题：跟踪时身份切换频繁
     解决：对比多种算法，选择适合红外场景的方案
   
   - 问题：模型量化后精度下降
     解决：使用红外图像作为校准数据集，调整量化参数

- 14:00-15:00 学习Ghost Module原理
  * 阅读论文：GhostNet: More Features from Cheap Operations
  * 理解核心思想：
    \`\`\`
    传统卷积：直接生成n个特征图，计算量大
    Ghost Module：
      1. 用少量卷积生成m个本征特征图(m < n)
      2. 对每个本征特征图做cheap操作生成ghost特征图
      3. 拼接得到n个特征图
    
    计算量降低：约为传统卷积的1/2
    \`\`\`
  
- 15:00-16:30 编写Ghost-C3代码
  * 在 models/common.py 中添加：
  \`\`\`python
  class GhostConv(nn.Module):
      def __init__(self, c1, c2, k=1, s=1, g=1, act=True):
          super().__init__()
          c_ = c2 // 2  # hidden channels
          self.cv1 = Conv(c1, c_, k, s, None, g, act)
          self.cv2 = Conv(c_, c_, 5, 1, None, c_, act)
      
      def forward(self, x):
          y = self.cv1(x)
          return torch.cat([y, self.cv2(y)], 1)
  
  class Ghost_C3(nn.Module):
      # C3 module with Ghost convolutions
      def __init__(self, c1, c2, n=1, shortcut=True, g=1, e=0.5):
          super().__init__()
          c_ = int(c2 * e)
          self.cv1 = GhostConv(c1, c_, 1, 1)
          self.cv2 = GhostConv(c1, c_, 1, 1)
          self.cv3 = Conv(2 * c_, c2, 1)
          self.m = nn.Sequential(*(GhostBottleneck(c_, c_) for _ in range(n)))
      
      def forward(self, x):
          return self.cv3(torch.cat((self.m(self.cv1(x)), self.cv2(x)), 1))
  \`\`\`

  * 阅读论文：ShuffleNet: An Extremely Efficient CNN for Mobile Devices
  * 理解核心思想：
    \`\`\`
    问题：分组卷积导致组间信息不流通
    解决：通道混洗（Channel Shuffle）
    
    步骤：
    1. 分组卷积
    2. 通道重排：将各组特征交叉混合
    3. 下一层分组卷积能看到上一层所有组的特征
    \`\`\`
  
- 15:00-16:30 编写Shuffle-C3代码
  * 在 models/common.py 中添加：
  \`\`\`python
  def channel_shuffle(x, groups):
      batch, channels, height, width = x.size()
      channels_per_group = channels // groups
      x = x.view(batch, groups, channels_per_group, height, width)
      x = torch.transpose(x, 1, 2).contiguous()
      x = x.view(batch, -1, height, width)
      return x
  
  class ShuffleConv(nn.Module):
      def __init__(self, c1, c2, k=1, s=1, g=1, act=True):
          super().__init__()
          self.conv = Conv(c1, c2, k, s, None, g, act)
          self.groups = g
      
      def forward(self, x):
          x = self.conv(x)
          return channel_shuffle(x, self.groups)
  
  class Shuffle_C3(nn.Module):
      # C3 module with Shuffle convolutions
      def __init__(self, c1, c2, n=1, shortcut=True, g=1, e=0.5):
          super().__init__()
          c_ = int(c2 * e)
          self.cv1 = ShuffleConv(c1, c_, 1, 1, g=2)
          self.cv2 = ShuffleConv(c1, c_, 1, 1, g=2)
          self.cv3 = Conv(2 * c_, c2, 1)
          self.m = nn.Sequential(*(ShuffleBottleneck(c_, c_) for _ in range(n)))
      
      def forward(self, x):
          return self.cv3(torch.cat((self.m(self.cv1(x)), self.cv2(x)), 1))
  \`\`\`

- 14:00-15:30 学习IoU系列损失函数
  * IoU (Intersection over Union)
    \`\`\`
    IoU = (A ∩ B) / (A ∪ B)
    问题：当两个框不相交时，IoU=0，梯度为0，无法优化
    \`\`\`
  
  * GIoU (Generalized IoU)
    \`\`\`
    考虑最小包围框，解决不相交时梯度为0的问题
    \`\`\`
  
  * DIoU (Distance IoU)
    \`\`\`
    考虑中心点距离，加快收敛
    DIoU = IoU - ρ²(b, bᵍᵗ) / c²
    其中ρ是中心点距离，c是最小包围框对角线长度
    \`\`\`
  
  * CIoU (Complete IoU)
    \`\`\`
    在DIoU基础上增加长宽比惩罚
    CIoU = DIoU - α * v
    其中v衡量长宽比一致性
    \`\`\`
  
  * EIoU (Efficient IoU)
    \`\`\`
    分别考虑宽度和高度的差异
    \`\`\`
  
  * SIoU (Scylla IoU)
    \`\`\`
    引入角度损失，特别适合红外目标
    \`\`\`

**下午 14:00-17:00【毕设-注意力机制实现】**
- 14:00-15:00 学习CBAM注意力机制
  * CBAM = Channel Attention + Spatial Attention
  
  * Channel Attention Module (CAM):
    \`\`\`
    1. 全局平均池化 + 全局最大池化
    2. 通过共享MLP
    3. 逐元素相加后Sigmoid
    4. 与输入特征相乘
    \`\`\`
  
  * Spatial Attention Module (SAM):
    \`\`\`
    1. 在通道维度做平均池化和最大池化
    2. 拼接后通过卷积
    3. Sigmoid激活
    4. 与输入特征相乘
    \`\`\`
  
- 15:00-16:30 编写CBAM代码
  \`\`\`python
  class ChannelAttention(nn.Module):
      def __init__(self, in_channels, ratio=16):
          super().__init__()
          self.avg_pool = nn.AdaptiveAvgPool2d(1)
          self.max_pool = nn.AdaptiveMaxPool2d(1)
          self.fc = nn.Sequential(
              nn.Conv2d(in_channels, in_channels // ratio, 1, bias=False),
              nn.ReLU(),
              nn.Conv2d(in_channels // ratio, in_channels, 1, bias=False)
          )
          self.sigmoid = nn.Sigmoid()
      
      def forward(self, x):
          avg_out = self.fc(self.avg_pool(x))
          max_out = self.fc(self.max_pool(x))
          out = self.sigmoid(avg_out + max_out)
          return x * out
  
  class SpatialAttention(nn.Module):
      def __init__(self, kernel_size=7):
          super().__init__()
          self.conv = nn.Conv2d(2, 1, kernel_size, padding=kernel_size//2, bias=False)
          self.sigmoid = nn.Sigmoid()
      
      def forward(self, x):
          avg_out = torch.mean(x, dim=1, keepdim=True)
          max_out, _ = torch.max(x, dim=1, keepdim=True)
          x_cat = torch.cat([avg_out, max_out], dim=1)
          out = self.sigmoid(self.conv(x_cat))
          return x * out
  
  class CBAM(nn.Module):
      def __init__(self, in_channels, ratio=16, kernel_size=7):
          super().__init__()
          self.ca = ChannelAttention(in_channels, ratio)
          self.sa = SpatialAttention(kernel_size)
      
      def forward(self, x):
          x = self.ca(x)
          x = self.sa(x)
          return x
  \`\`\`

  * 核心创新：双重关联策略
    \`\`\`
    传统方法：只用高置信度检测框进行匹配
    问题：遮挡时，目标的检测置信度降低，被丢弃，导致轨迹中断
    
    ByteTrack解决方案：
    
    步骤1：第一次关联
    - 用高置信度检测框（score > 0.6）与轨迹匹配
    - 使用IoU作为匹配指标
    - 匈牙利算法分配
    
    步骤2：第二次关联  
    - 用低置信度检测框（0.1 < score < 0.6）
    - 与第一次未匹配的轨迹进行匹配
    - 找回被遮挡的目标
    
    步骤3：轨迹管理
    - 匹配成功：更新轨迹
    - 新检测：初始化轨迹
    - 未匹配轨迹：保留一段时间
    
    优势：
    1. 不需要外观特征，计算效率高
    2. 有效处理遮挡情况
    3. 适合红外图像（外观特征不明显）
    \`\`\`
  
  * 与DeepSORT对比：
    \`\`\`
    | 特性 | DeepSORT | ByteTrack |
    |------|----------|-----------|
    | 外观特征 | 需要ReID网络 | 不需要 |
    | 计算复杂度 | 较高 | 较低 |
    | 遮挡处理 | 外观特征 | 低置信度检测 |
    | 适用场景 | 纹理丰富 | 纹理弱（红外）|

**下午 14:00-17:00【毕设-CenterTrack学习】**
- 14:00-15:30 CenterTrack算法原理学习
  * 阅读论文：Tracking Objects as Points
  
  * 核心思想：将跟踪转化为关键点检测
    \`\`\`
    传统方法：检测 + 数据关联（两阶段）
    CenterTrack：端到端直接预测跟踪结果
    
    网络输入：
    - 当前帧图像 I_t
    - 前一帧图像 I_{t-1}
    - 前一帧的heatmap（中心点热图）
    
    网络输出：
    - 当前帧中心点热图
    - 目标尺寸
    - 中心点偏移量（相对于前一帧）
    
    跟踪过程：
    1. 检测当前帧的目标中心点
    2. 根据预测的偏移量，关联到前一帧的目标
    3. 直接得到目标ID
    
    优势：
    4. 端到端训练
    5. 避免复杂的数据关联
    6. 速度快
    
    劣势：
    7. 对快速运动目标效果差
    8. 长时间遮挡后恢复能力弱
    9. 需要训练（不像DeepSORT/ByteTrack可以即插即用）
    \`\`\`
  
- 15:30-17:00 三种跟踪算法对比总结
  * 制作对比表格：
    \`\`\`markdown
    | 算法 | 原理 | 优势 | 劣势 | 适用场景 |
    |------|------|------|------|----------|
    | DeepSORT | 卡尔曼滤波 + ReID | 遮挡恢复好 | 计算量大，需要外观特征 | 可见光，纹理丰富 |
    | ByteTrack | 双重关联 | 简单高效，不需要ReID | 长时间遮挡处理弱 | 红外图像，实时性要求高 |
    | CenterTrack | 端到端预测偏移 | 速度快 | 快速运动和长遮挡效果差 | 目标运动平缓 |
    \`\`\`
  
  * 预判：ByteTrack最适合红外场景
    - 理由1：红外图像外观特征不明显，DeepSORT的ReID优势不大
    - 理由2：ByteTrack的双重关联能有效处理检测不稳定问题
    - 理由3：计算效率高，有利于嵌入式部署
  
  * 实验计划：

- 19:00-20:30 计算机网络第4章：传输层（下）
  * TCP连接管理（重点！）：
    - 三次握手（建立连接）：
      \`\`\`
      Client                Server
      SYN=1, seq=x    →
                      ←  SYN=1, ACK=1, seq=y, ack=x+1
      ACK=1, ack=y+1  →
      
      为什么需要三次而不是两次？
      - 防止失效的连接请求到达服务器
      - 确认双方的发送和接收能力
      \`\`\`
    
    - 四次挥手（释放连接）：
      \`\`\`
      Client                Server
      FIN=1, seq=u    →
                      ←  ACK=1, ack=u+1
                      ←  FIN=1, seq=w, ack=u+1
      ACK=1, ack=w+1  →
      (等待2MSL)
      
      为什么需要四次？
      - TCP是全双工，双方都要主动关闭
      - 服务器可能还有数据要发送
      
      为什么要等待2MSL？
      - 确保最后的ACK被对方收到
      - 防止旧连接的数据出现在新连接中
      \`\`\`
  
  * TCP可靠传输（重点！）：
    - 序号和确认号
    - 超时重传
    - 快速重传
    - 滑动窗口
  
  * TCP流量控制：
    - 滑动窗口机制

  * TCP拥塞控制（重点！）：

  * 事务管理（重点！）：
    - ACID特性：
      * Atomicity（原子性）：全做或全不做
      * Consistency（一致性）：保持数据一致性约束
      * Isolation（隔离性）：并发事务互不干扰
      * Durability（持久性）：提交后永久保存
    
    - 并发控制：
      * 问题：丢失修改、不可重复读、读脏数据
      * 封锁协议：一级、二级、三级封锁协议
      * 两段锁协议（2PL）
      * 死锁的预防和解决
    
    - 事务隔离级别（重点！）：
      * Read Uncommitted（读未提交）
      * Read Committed（读已提交）
      * Repeatable Read（可重复读）
      * Serializable（串行化）
  
  * 数据库设计：
    - ER图：实体、属性、联系
    - 范式理论（重点！）：
      * 第一范式（1NF）：属性不可分
      * 第二范式（2NF）：消除部分函数依赖
      * 第三范式（3NF）：消除传递函数依赖
      * BCNF：消除主属性对候选码的部分和传递依赖

  # convert_to_rknn.py
  from rknn.api import RKNN
  
  def convert_onnx_to_rknn():
      rknn = RKNN(verbose=True)
      
      # 配置模型
      print('--> Config model')
      rknn.config(
          mean_values=[[0, 0, 0]],
          std_values=[[255, 255, 255]],
          target_platform='rv1126',
          quantized_dtype='asymmetric_quantized-u8',
          optimization_level=3
      )
      
      # 加载ONNX模型
      print('--> Loading ONNX model')
      ret = rknn.load_onnx(model='best.onnx')
      if ret != 0:
          print('Load model failed!')
          return
      
      # 构建RKNN模型（INT8量化）
      print('--> Building model')
      ret = rknn.build(
          do_quantization=True,
          dataset='./dataset.txt',
          rknn_batch_size=1
      )
      if ret != 0:
          print('Build model failed!')
          return
      
      # 导出RKNN模型
      print('--> Export RKNN model')
      ret = rknn.export_rknn('./best.rknn')
      if ret != 0:
          print('Export model failed!')
          return
      
      print('Export RKNN model success!')
      
      # 性能评估
      print('--> Evaluate model performance')
      rknn.init_runtime()
      
      # 测试推理
      import cv2
      import numpy as np
      img = cv2.imread('test.jpg')
      img = cv2.resize(img, (640, 640))
      img = np.expand_dims(img, axis=0)
      
      outputs = rknn.inference(inputs=[img])
      print('Inference success!')
      
      rknn.release()
  
  if __name__ == '__main__':
      convert_onnx_to_rknn()

  // yolov5_rknn.cpp
  #include "rknn_api.h"
  #include <opencv2/opencv.hpp>
  #include <vector>
  
  class YOLOv5Detector {
  private:
      rknn_context ctx;
      int input_width = 640;
      int input_height = 640;
      int input_channels = 3;
      
      // 输出层信息
      rknn_output_attr output_attrs[3];
      
  public:
      int init(const char* model_path);
      std::vector<Detection> detect(const cv2::Mat& img);
      void release();
      
  private:
      cv::Mat preprocess(const cv::Mat& img);
      std::vector<Detection> post_process(rknn_output outputs[]);
      std::vector<Detection> nms(std::vector<Detection>& dets, float threshold);
  };
  
  int YOLOv5Detector::init(const char* model_path) {
      // 读取RKNN模型文件
      FILE* fp = fopen(model_path, "rb");
      if (!fp) {
          printf("Open model file failed!\n");
          return -1;
      }
      
      fseek(fp, 0, SEEK_END);
      int model_len = ftell(fp);
      fseek(fp, 0, SEEK_SET);
      
      void* model = malloc(model_len);
      if (!model) {
          printf("Malloc model buffer failed!\n");
          fclose(fp);
          return -1;
      }
      
      size_t read_size = fread(model, 1, model_len, fp);
      fclose(fp);
      
      // 初始化RKNN上下文
      int ret = rknn_init(&ctx, model, model_len, 0, NULL);
      free(model);
      
      if (ret < 0) {
          printf("rknn_init failed! ret=%d\n", ret);
          return -1;
      }
      
      // 查询模型输入输出信息
      rknn_input_output_num io_num;
      ret = rknn_query(ctx, RKNN_QUERY_IN_OUT_NUM, &io_num, sizeof(io_num));
      printf("Model input num: %d, output num: %d\n", io_num.n_input, io_num.n_output);
      
      // 查询输出层属性
      for (int i = 0; i < io_num.n_output; i++) {
          output_attrs[i].index = i;
          ret = rknn_query(ctx, RKNN_QUERY_OUTPUT_ATTR, &output_attrs[i], sizeof(rknn_output_attr));
      }
      
      return 0;
  }
  
  std::vector<Detection> YOLOv5Detector::detect(const cv::Mat& img) {
      // 预处理
      cv::Mat preprocessed = preprocess(img);
      
      // 设置输入
      rknn_input inputs[1];
      memset(inputs, 0, sizeof(inputs));
      inputs[0].index = 0;
      inputs[0].type = RKNN_TENSOR_UINT8;
      inputs[0].size = input_width * input_height * input_channels;
      inputs[0].fmt = RKNN_TENSOR_NHWC;
      inputs[0].buf = preprocessed.data;
      
      int ret = rknn_inputs_set(ctx, 1, inputs);
      if (ret < 0) {
          printf("rknn_inputs_set failed! ret=%d\n", ret);
          return {};
      }
      
      // 执行推理
      ret = rknn_run(ctx, NULL);
      if (ret < 0) {
          printf("rknn_run failed! ret=%d\n", ret);
          return {};
      }
      
      // 获取输出
      rknn_output outputs[3];
      memset(outputs, 0, sizeof(outputs));
      for (int i = 0; i < 3; i++) {
          outputs[i].index = i;
          outputs[i].want_float = 1;
      }
      
      ret = rknn_outputs_get(ctx, 3, outputs, NULL);
      if (ret < 0) {
          printf("rknn_outputs_get failed! ret=%d\n", ret);
          return {};
      }
      
      // 后处理
      std::vector<Detection> detections = post_process(outputs);
      
      // 释放输出
      rknn_outputs_release(ctx, 3, outputs);
      
      return detections;
  }
  
  cv::Mat YOLOv5Detector::preprocess(const cv::Mat& img) {
      cv::Mat resized;
      cv::resize(img, resized, cv::Size(input_width, input_height));
      // 如果需要，转换颜色空间
      // cv::cvtColor(resized, resized, cv::COLOR_BGR2RGB);
      return resized;
  }
  
  std::vector<Detection> YOLOv5Detector::post_process(rknn_output outputs[]) {
      std::vector<Detection> all_dets;
      
      // 解析三个输出层
      // outputs[0]: 80x80特征图
      // outputs[1]: 40x40特征图  
      // outputs[2]: 20x20特征图
      
      for (int i = 0; i < 3; i++) {
          float* output = (float*)outputs[i].buf;
          int grid_size = (i == 0) ? 80 : ((i == 1) ? 40 : 20);
          int stride = (i == 0) ? 8 : ((i == 1) ? 16 : 32);
          
          // 解析每个grid cell
          for (int h = 0; h < grid_size; h++) {
              for (int w = 0; w < grid_size; w++) {
                  for (int a = 0; a < 3; a++) {  // 3个anchor
                      int base_index = (h * grid_size + w) * 3 * 85 + a * 85;
                      
                      float obj_score = output[base_index + 4];
                      if (obj_score < 0.25) continue;  // 置信度阈值
                      
                      // 解析bbox
                      float cx = output[base_index + 0];
                      float cy = output[base_index + 1];
                      float w = output[base_index + 2];
                      float h = output[base_index + 3];
                      
                      // 解析类别
                      int max_class = 0;
                      float max_score = 0;
                      for (int c = 0; c < 80; c++) {
                          float score = output[base_index + 5 + c];
                          if (score > max_score) {
                              max_score = score;
                              max_class = c;
                          }
                      }
                      
                      float confidence = obj_score * max_score;
                      if (confidence < 0.45) continue;
                      
                      Detection det;
                      det.bbox = {cx, cy, w, h};
                      det.class_id = max_class;
                      det.confidence = confidence;
                      all_dets.push_back(det);
                  }
              }
          }
      }
      
      // NMS
      std::vector<Detection> final_dets = nms(all_dets, 0.45);
      
      return final_dets;
  }
