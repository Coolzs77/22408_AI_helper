<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026寒假复试与毕设冲刺看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            padding: 2rem 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .header-stats {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.875rem;
            opacity: 0.9;
            margin-bottom: 0.25rem;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        #countdown {
            font-size: 2rem;
            font-weight: bold;
        }
        
        #total-progress {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .progress-container {
            margin-top: 1rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            height: 1rem;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background-color: #4ade80;
            transition: width 0.3s ease;
            width: 0%;
        }
        
        main {
            padding: 2rem 1rem;
        }
        
        .view-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            gap: 1rem;
        }
        
        button {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }
        
        .btn-primary {
            background-color: #4f46e5;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #4338ca;
        }
        
        .btn-secondary {
            background-color: #334155;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #475569;
        }
        
        .card {
            background-color: #1e293b;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 1.5rem;
        }
        
        .card h2 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }
        
        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
        }
        
        .day-button {
            padding: 1rem;
            border-radius: 0.5rem;
            background-color: #334155;
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .day-button:hover {
            background-color: #475569;
        }
        
        .day-date {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-bottom: 0.25rem;
        }
        
        .day-num {
            font-size: 1.125rem;
            font-weight: bold;
        }
        
        .day-active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: white;
        }
        
        .day-selected {
            box-shadow: 0 0 0 4px #a855f7;
        }
        
        .task-section {
            margin-bottom: 2rem;
        }
        
        .task-section h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .task-item {
            background-color: #334155;
            border-radius: 0.5rem;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s;
        }
        
        .task-item:hover {
            background-color: #475569;
        }
        
        .task-completed {
            opacity: 0.5;
            text-decoration: line-through;
        }
        
        .task-checkbox {
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 0.25rem;
            cursor: pointer;
            accent-color: #a855f7;
        }
        
        .task-content {
            flex: 1;
        }
        
        .task-text {
            font-weight: 500;
            margin-bottom: 0.25rem;
        }
        
        .task-time {
            font-size: 0.875rem;
            color: #94a3b8;
        }
        
        .phase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        
        .phase-card {
            background-color: #1e293b;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s;
        }
        
        .phase-card:hover {
            transform: translateY(-4px);
        }
        
        .phase-header {
            padding: 1.5rem;
            border-radius: 0.75rem;
            color: white;
            margin-bottom: 1rem;
        }
        
        .phase-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        
        .phase-dates {
            font-size: 0.875rem;
            opacity: 0.9;
        }
        
        .phase-goals {
            list-style: none;
        }
        
        .phase-goals li {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            color: #cbd5e1;
        }
        
        .phase-goals li::before {
            content: "✓";
            color: #4ade80;
            font-weight: bold;
        }
        
        .hidden {
            display: none !important;
        }
        
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }
        
        .color-blue { background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%); }
        .color-green { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .color-yellow { background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%); }
        .color-red { background: linear-gradient(135deg, #ef4444 0%, #ec4899 100%); }
        .color-purple { background: linear-gradient(135deg, #8b5cf6 0%, #4f46e5 100%); }
        
        .text-yellow { color: #fbbf24; }
        .text-blue { color: #60a5fa; }
        .text-green { color: #4ade80; }
        .text-purple { color: #a78bfa; }
        
        @media (max-width: 768px) {
            h1 { font-size: 1.5rem; }
            .header-stats { gap: 1.5rem; }
            .timeline-grid { grid-template-columns: repeat(4, 1fr); }
            .phase-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    
    <header>
        <div class="container">
            <h1>📚 2026寒假复试与毕设冲刺看板</h1>
            <div class="header-stats">
                <div class="stat">
                    <p class="stat-label">执行周期</p>
                    <p class="stat-value">2026.01.25 - 2026.02.27</p>
                </div>
                <div class="stat">
                    <p class="stat-label">距离目标</p>
                    <p id="countdown">-- 天</p>
                </div>
                <div class="stat">
                    <p class="stat-label">总任务完成率</p>
                    <p id="total-progress">0%</p>
                </div>
            </div>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </div>
    </header>

    <main class="container">
        
        <div class="view-toggle">
            <button onclick="switchView('timeline')" id="btn-timeline" class="btn-primary">
                📅 时间轴模式
            </button>
            <button onclick="switchView('phase')" id="btn-phase" class="btn-secondary">
                📊 五周阶段
            </button>
        </div>

        <div id="timeline-view">
            <div class="card">
                <h2>🗓️ 34天时间轴</h2>
                <div class="timeline-grid" id="timeline-grid"></div>
            </div>

            <div id="daily-tasks" class="card">
                <h2>今日任务</h2>
                <p class="empty-state">点击上方日期查看当日任务</p>
            </div>
        </div>

        <div id="phase-view" class="hidden">
            <div class="phase-grid" id="phase-container"></div>
        </div>

    </main>

    <script>
        const START_DATE = new Date('2026-01-25');
        const END_DATE = new Date('2026-02-27');
        const TOTAL_DAYS = 34;

        const phases = [
            {
                name: '第一周：基础夯实',
                dates: '1.25-1.31',
                color: 'color-blue',
                goals: [
                    '数据结构基础（栈、队列、链表）',
                    'YOLOv5环境搭建与测试',
                    'FLIR数据集下载与预处理',
                    '英语自我介绍准备'
                ]
            },
            {
                name: '第二周：进阶提升',
                dates: '2.1-2.7',
                color: 'color-green',
                goals: [
                    '二叉树与递归专题',
                    '轻量化网络（GhostNet/ShuffleNet）',
                    'YOLOv5s基准模型训练',
                    '操作系统核心知识点'
                ]
            },
            {
                name: '第三周：深度突破',
                dates: '2.8-2.14',
                color: 'color-yellow',
                goals: [
                    '动态规划与图论',
                    '跟踪算法（DeepSORT/ByteTrack）',
                    '注意力机制引入（CBAM/CA）',
                    '计算机网络重点'
                ]
            },
            {
                name: '第四周：综合模拟',
                dates: '2.15-2.21',
                color: 'color-red',
                goals: [
                    '机试模拟（3小时3-4题）',
                    '消融实验与对比',
                    '损失函数优化（CIoU/EIoU）',
                    '面试问题模拟'
                ]
            },
            {
                name: '第五周：冲刺收官',
                dates: '2.22-2.27',
                color: 'color-purple',
                goals: [
                    '全流程复试模拟',
                    'RKNN模型部署测试',
                    '毕设PPT制作',
                    '知识点查漏补缺'
                ]
            }
        ];

        const dailyTasksTemplate = {
            morning: [
                { id: 'study', text: '专业课复习（操作系统/计算机网络/数据库）', time: '08:30-12:00' }
            ],
            afternoon: [
                { id: 'algorithm', text: '算法训练（LeetCode 2-3题）', time: '14:00-17:00' }
            ],
            evening: [
                { id: 'thesis', text: '毕设工作（文献阅读/实验/写作）', time: '17:00-18:00' },
                { id: 'english', text: '英语准备（自我介绍/专业词汇）', time: '19:00-21:30' }
            ],
            exercise: { id: 'exercise', text: '运动打卡', time: '07:00-08:00' }
        };

        const STORAGE_KEY_PREFIX = 'task_';
        let currentView = 'timeline';
        let selectedDate = null;

        function init() {
            updateCountdown();
            renderTimeline();
            renderPhaseView();
            updateProgress();
            highlightToday();
            setInterval(updateCountdown, 60000);
        }

        function updateCountdown() {
            const now = new Date();
            const diff = END_DATE - now;
            const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
            document.getElementById('countdown').textContent = `${days} 天`;
        }

        function renderTimeline() {
            const grid = document.getElementById('timeline-grid');
            grid.innerHTML = '';
            
            for (let i = 0; i < TOTAL_DAYS; i++) {
                const date = new Date(START_DATE);
                date.setDate(date.getDate() + i);
                
                const day = document.createElement('button');
                day.className = 'day-button';
                day.innerHTML = `
                    <div class="day-date">${date.getMonth() + 1}/${date.getDate()}</div>
                    <div class="day-num">第${i + 1}天</div>
                `;
                day.onclick = () => selectDay(date, i);
                day.id = `day-${i}`;
                grid.appendChild(day);
            }
        }

        function highlightToday() {
            const now = new Date();
            const daysSinceStart = Math.floor((now - START_DATE) / (1000 * 60 * 60 * 24));
            
            if (daysSinceStart >= 0 && daysSinceStart < TOTAL_DAYS) {
                const todayBtn = document.getElementById(`day-${daysSinceStart}`);
                if (todayBtn) {
                    todayBtn.classList.add('day-active');
                    const today = new Date(START_DATE);
                    today.setDate(today.getDate() + daysSinceStart);
                    selectDay(today, daysSinceStart);
                }
            }
        }

        function selectDay(date, dayIndex) {
            selectedDate = date;
            
            document.querySelectorAll('[id^="day-"]').forEach(btn => {
                btn.classList.remove('day-selected');
            });
            
            const selectedBtn = document.getElementById(`day-${dayIndex}`);
            selectedBtn.classList.add('day-selected');
            
            renderDailyTasks(date, dayIndex);
        }

        function renderDailyTasks(date, dayIndex) {
            const container = document.getElementById('daily-tasks');
            const dateStr = `${date.getMonth() + 1}月${date.getDate()}日`;
            const weekDay = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][date.getDay()];
            
            container.innerHTML = `
                <div style="margin-bottom: 1.5rem;">
                    <h2>${dateStr} ${weekDay} - 第${dayIndex + 1}天任务清单</h2>
                    <p style="color: #64748b;">完成后勾选任务，进度会自动保存</p>
                </div>

                <div class="task-section">
                    <h3 class="text-yellow">🏃 早晨运动</h3>
                    <div class="task-list">
                        ${renderTask(dayIndex, 'exercise', dailyTasksTemplate.exercise)}
                    </div>
                </div>

                <div class="task-section">
                    <h3 class="text-blue">☀️ 上午学习（专业课）</h3>
                    <div class="task-list">
                        ${dailyTasksTemplate.morning.map(task => renderTask(dayIndex, 'morning', task)).join('')}
                    </div>
                </div>

                <div class="task-section">
                    <h3 class="text-green">🌤️ 下午训练（机试/算法）</h3>
                    <div class="task-list">
                        ${dailyTasksTemplate.afternoon.map(task => renderTask(dayIndex, 'afternoon', task)).join('')}
                    </div>
                </div>

                <div class="task-section">
                    <h3 class="text-purple">🌙 晚间学习（毕设/英语）</h3>
                    <div class="task-list">
                        ${dailyTasksTemplate.evening.map(task => renderTask(dayIndex, 'evening', task)).join('')}
                    </div>
                </div>
            `;
        }

        function renderTask(dayIndex, period, task) {
            const storageKey = `${STORAGE_KEY_PREFIX}${dayIndex}_${period}_${task.id}`;
            const isCompleted = localStorage.getItem(storageKey) === 'true';
            
            return `
                <div class="task-item ${isCompleted ? 'task-completed' : ''}">
                    <input 
                        type="checkbox" 
                        ${isCompleted ? 'checked' : ''} 
                        onchange="toggleTask('${storageKey}', this.checked)"
                        class="task-checkbox"
                    >
                    <div class="task-content">
                        <p class="task-text">${task.text}</p>
                        <p class="task-time">${task.time}</p>
                    </div>
                </div>
            `;
        }

        function toggleTask(storageKey, isCompleted) {
            localStorage.setItem(storageKey, isCompleted);
            updateProgress();
            
            if (selectedDate !== null) {
                const dayIndex = Math.floor((selectedDate - START_DATE) / (1000 * 60 * 60 * 24));
                renderDailyTasks(selectedDate, dayIndex);
            }
        }

        function updateProgress() {
            let totalTasks = 0;
            let completedTasks = 0;
            
            for (let day = 0; day < TOTAL_DAYS; day++) {
                ['exercise', 'morning', 'afternoon', 'evening'].forEach(period => {
                    if (period === 'exercise') {
                        totalTasks++;
                        const key = `${STORAGE_KEY_PREFIX}${day}_${period}_exercise`;
                        if (localStorage.getItem(key) === 'true') completedTasks++;
                    } else {
                        const tasks = dailyTasksTemplate[period] || [];
                        tasks.forEach(task => {
                            totalTasks++;
                            const key = `${STORAGE_KEY_PREFIX}${day}_${period}_${task.id}`;
                            if (localStorage.getItem(key) === 'true') completedTasks++;
                        });
                    }
                });
            }
            
            const percentage = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
            document.getElementById('total-progress').textContent = `${percentage}%`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;
        }

        function renderPhaseView() {
            const container = document.getElementById('phase-container');
            container.innerHTML = phases.map(phase => `
                <div class="phase-card">
                    <div class="phase-header ${phase.color}">
                        <h3 class="phase-title">${phase.name}</h3>
                        <p class="phase-dates">${phase.dates}</p>
                    </div>
                    <ul class="phase-goals">
                        ${phase.goals.map(goal => `<li>${goal}</li>`).join('')}
                    </ul>
                </div>
            `).join('');
        }

        function switchView(view) {
            currentView = view;
            
            if (view === 'timeline') {
                document.getElementById('timeline-view').classList.remove('hidden');
                document.getElementById('phase-view').classList.add('hidden');
                document.getElementById('btn-timeline').className = 'btn-primary';
                document.getElementById('btn-phase').className = 'btn-secondary';
            } else {
                document.getElementById('timeline-view').classList.add('hidden');
                document.getElementById('phase-view').classList.remove('hidden');
                document.getElementById('btn-phase').className = 'btn-primary';
                document.getElementById('btn-timeline').className = 'btn-secondary';
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
